x-app: &celery-app
  build: .
  env_file:
    - .env
  volumes:
    - ./src:/app/src
  depends_on:
    postgres_db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrator:
      condition: service_completed_successfully
  restart: unless-stopped


services:
  postgres_db:
    image: postgres:18
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: backend_cinema
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  migrator:
    build: .
    container_name: alembic_migrator
    command: alembic upgrade head
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres_db:
        condition: service_healthy

  redis:
    image: redis:7
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    <<: *celery-app
    container_name: celery_worker
    command: celery -A config.celery:celery_app worker -l info

  celery_beat:
    <<: *celery-app
    container_name: celery_beat
    command: celery -A config.celery:celery_app beat -l info

volumes:
  postgres_data:
  redis_data: