services:
  postgres_db:
    image: postgres:18
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: backend_cinema
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres_db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  migrator:
    build: .
    container_name: alembic_migrator
    command: alembic upgrade head
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres_db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  celery_worker:
    build: .
    command: celery -A celery_worker.celery_config:celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres_db:
        condition: service_healthy

  celery_beat:
    build: .
    command: celery -A celery_worker.celery_config:celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: pgsty/minio:latest
    command: server --console-address ":9001" /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - .env
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    command: [ "/bin/sh", "-c", "/commands/setup_minio.sh" ]
    restart: "no"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data: