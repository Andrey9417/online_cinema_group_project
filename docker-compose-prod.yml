x-app: &celery-app
  build: .
  env_file:
    - .env
  depends_on:
    postgres_db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrator:
      condition: service_completed_successfully
  restart: unless-stopped


services:
  postgres_db:
    image: postgres:18
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: backend_cinema
    restart: unless-stopped
    command: >
      gunicorn main:app
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --log-level info
      --access-logfile -
      --error-logfile -
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  migrator:
    build: .
    container_name: alembic_migrator
    restart: no
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5

  celery_worker:
    <<: *celery-app
    command: celery -A config.celery:celery_app worker -l info

  celery_beat:
    <<: *celery-app
    command: celery -A config.celery:celery_app beat -l info

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server --console-address ":9001" /data
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    command: [ "/bin/sh", "-c", "/commands/setup_minio.sh" ]
    restart: "no"
    environment:
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_STORAGE: ${MINIO_STORAGE}
    depends_on:
      minio:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web
    env_file:
      - ./docker/nginx/.env

volumes:
  postgres_data:
  redis_data:
  minio_data: