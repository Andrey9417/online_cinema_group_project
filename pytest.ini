[pytest]
pythonpath = src
testpaths = tests
addopts = --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
env =
    D:POSTGRES_USER=test
    D:POSTGRES_PASSWORD=test
    D:POSTGRES_DB=cinema_test
    D:POSTGRES_HOST=localhost
    D:POSTGRES_PORT=5433