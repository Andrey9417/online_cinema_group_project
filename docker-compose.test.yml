services:
  postgres_test:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cinema_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d cinema_test" ]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build: .
    command: pytest
    environment:
      POSTGRES_HOST: postgres_test
      POSTGRES_PORT: "5432"
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
    depends_on:
      postgres_test:
        condition: service_healthy